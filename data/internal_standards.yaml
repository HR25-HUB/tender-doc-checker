Техническое задание:
  - Содержит чёткие количественные параметры (единицы измерения, объёмы)
  - Указан срок исполнения
  - Описаны условия приёмки и критерии оценки

Форма договора:
  - Имеется пункт об ответственности сторон
  - Указана процедура расторжения договора
  - Валюта, оплата и сроки расчёта прописаны однозначно
